name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút chạy build thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradle
        run: chmod +x gradlew

      - name: Tiến hành Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Đóng gói file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
