name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Ten_Thu_Muc_Con # Đổi thành tên thư mục chứa file gradlew của bạn

    steps:
      - name: Tải mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cấp quyền thực thi cho Gradle
        run: chmod +x gradlew

      - name: Tiến hành Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Đóng gói file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Ten_Thu_Muc_Con/app/build/outputs/apk/debug/*.apk # Nhớ thêm tên thư mục con ở đầu đường dẫn
